# Put in: /opt/splunk/etc/system/local/inputs.conf   (on the Splunk server, Ubuntu)
# Collects the server's own SSH/auth logs into the "linux" index.
[monitor:///var/log/auth.log]
index = linux
sourcetype = linux_secure
disabled = 0

[monitor:///var/log/syslog]
index = linux
sourcetype = syslog
disabled = 0
